name: Build VRX OTMZ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP and Fix Manifest
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ $(ls -1 temp_extract | wc -l) -eq 1 ] && [ -d "temp_extract/$(ls -1 temp_extract)" ]; then
              SUBDIR=$(ls -1 temp_extract)
              cp -rf temp_extract/"$SUBDIR"/* .
            else
              cp -rf temp_extract/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi
          find . -name "AndroidManifest.xml" -exec perl -0777 -i -pe 's/(?<!android:)(\bname=")/android:$1/g' {} +

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VRX-OTMZ-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
