name: Build VRX OTMZ APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if uploaded compressed
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ $(ls -1 temp_extract | wc -l) -eq 1 ] && [ -d "temp_extract/$(ls -1 temp_extract)" ]; then
              SUBDIR=$(ls -1 temp_extract)
              cp -rn temp_extract/"$SUBDIR"/* . 2>/dev/null || cp -r temp_extract/"$SUBDIR"/* .
            else
              cp -rn temp_extract/* . 2>/dev/null || cp -r temp_extract/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRX-OTMZ-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
